# File TỰ CHỨA hoàn chỉnh cho notification-service.yaml — không phụ thuộc file nào khác.
# Sinh tự động từ nguồn hợp nhất, mọi $ref trong file này chỉ trỏ nội bộ (#/components/...).
openapi: 3.0.3
info:
  title: Notification Service API
  version: 1.0.0
  description: Gửi thông báo đa kênh (FR-17..19)
servers:
  - url: http://localhost:4008
    description: Gọi trực tiếp service (bỏ qua Gateway)
  - url: http://localhost:3000/api/v1
    description: Qua API Gateway (local dev)
tags:
  - name: Notification
    description: Notification Service — FR-17..FR-19
security:
  - bearerAuth: []
paths:
  /notifications/me:
    get:
      tags:
        - Notification
      summary: Xem lịch sử thông báo đã nhận
      x-fr: FR-17, FR-18
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
  /notifications/channels:
    post:
      tags:
        - Notification
      summary: Đăng ký/kích hoạt thêm kênh thông báo mới
      x-fr: FR-19
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
              properties:
                name:
                  type: string
                  example: Zalo OA
                type:
                  type: string
                  enum:
                    - push
                    - sms
                    - email
                    - zalo
                    - webhook
      responses:
        '201':
          description: Đã thêm kênh mới
        '403':
          $ref: '#/components/responses/ForbiddenError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        channel:
          type: string
        title:
          type: string
        body:
          type: string
        sentAt:
          type: string
          format: date-time
  responses:
    ForbiddenError:
      description: Không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
