$kind: http-request
url: "{{BASE}}/drivers/{{DRIVER_ID}}/approve"
method: PATCH
headers:
  Authorization: Bearer {{ADMIN_TOKEN}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('approvalStatus = approved', () => pm.expect(pm.response.json().data.approvalStatus).to.eql('approved'));
    language: text/javascript
order: 1000
