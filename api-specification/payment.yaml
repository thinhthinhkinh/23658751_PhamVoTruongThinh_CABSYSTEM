# File TỰ CHỨA hoàn chỉnh cho payment-service.yaml — không phụ thuộc file nào khác.
# Sinh tự động từ nguồn hợp nhất, mọi $ref trong file này chỉ trỏ nội bộ (#/components/...).
openapi: 3.0.3
info:
  title: Payment Service API
  version: 1.0.0
  description: Xử lý thanh toán (FR-15, FR-16)
servers:
  - url: http://localhost:4007
    description: Gọi trực tiếp service (bỏ qua Gateway)
  - url: http://localhost:3000/api/v1
    description: Qua API Gateway (local dev)
tags:
  - name: Payment
    description: Payment Service — FR-15, FR-16
security:
  - bearerAuth: []
paths:
  /payments:
    post:
      tags:
        - Payment
      summary: Khởi tạo thanh toán cho 1 chuyến
      x-fr: FR-15
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentEnvelope'
  /payments/{id}:
    get:
      tags:
        - Payment
      summary: Xem trạng thái giao dịch
      x-fr: FR-15
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /payments/{id}/retry:
    post:
      tags:
        - Payment
      summary: Xử lý lại khi giao dịch điện tử thất bại
      x-fr: FR-16
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentEnvelope'
        '409':
          description: Giao dịch không ở trạng thái có thể thử lại
  /payments/webhook:
    post:
      tags:
        - Payment
      summary: Callback kết quả từ cổng thanh toán ngoài
      x-fr: FR-15, FR-16
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentId:
                  type: string
                status:
                  type: string
                  enum:
                    - success
                    - failed
                providerRef:
                  type: string
      responses:
        '200':
          description: Đã xử lý callback
  /customers/me/payments:
    get:
      tags:
        - Payment
      summary: Lịch sử thanh toán của khách hàng
      x-fr: FR-05
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        method:
          type: string
          enum:
            - cash
            - e-wallet
            - card
        amount:
          type: number
        status:
          type: string
          enum:
            - pending
            - success
            - failed
        providerRef:
          type: string
          nullable: true
          description: Tham chiếu phía cổng thanh toán ngoài, không lưu số thẻ
        createdAt:
          type: string
          format: date-time
    PaymentCreateRequest:
      type: object
      required:
        - tripId
        - method
      properties:
        tripId:
          type: string
          format: uuid
        method:
          type: string
          enum:
            - cash
            - e-wallet
            - card
    PaymentEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Payment'
  responses:
    NotFoundError:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
