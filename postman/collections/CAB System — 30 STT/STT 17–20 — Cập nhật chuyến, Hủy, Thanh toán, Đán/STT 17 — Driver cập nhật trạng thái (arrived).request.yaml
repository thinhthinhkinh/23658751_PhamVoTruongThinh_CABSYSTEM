$kind: http-request
url: "{{BASE}}/trips/{{TRIP_ID}}/status"
method: PATCH
headers:
  Authorization: Bearer {{DRIVER_TOKEN}}
  Content-Type: application/json
body:
  type: text
  content: '{ "status": "arrived" }'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('status = arrived', () => pm.expect(pm.response.json().data.status).to.eql('arrived'));
    language: text/javascript
order: 1000
