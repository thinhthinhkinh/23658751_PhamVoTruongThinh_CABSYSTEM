$kind: http-request
url: "{{BASE}}/customers/me/trips?limit=5&page=1"
method: GET
headers:
  Authorization: Bearer {{CUSTOMER_TOKEN}}
queryParams:
  limit: "5"
  page: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const r = pm.response.json();
      pm.test('Có meta', () => pm.expect(r.meta).to.be.ok);
    language: text/javascript
order: 4000
