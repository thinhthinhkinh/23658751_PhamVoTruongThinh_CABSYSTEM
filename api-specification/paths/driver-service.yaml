# File này được tách tự động từ cab-system-openapi.yaml gốc — KHÔNG chỉnh sửa file gốc nữa.
/drivers/register:
  post:
    tags:
      - Driver
    summary: Tài xế tự đăng ký
    x-fr: FR-02
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/driver.yaml#/DriverRegisterRequest
    responses:
      '201':
        description: Đăng ký thành công
        content:
          application/json:
            schema:
              $ref: ../components/schemas/driver.yaml#/DriverAuthResponse
      '409':
        $ref: ../components/responses/common.yaml#/ConflictError
/drivers:
  post:
    tags:
      - Driver
    summary: Nhân viên vận hành tạo tài khoản tài xế
    x-fr: FR-02
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/driver.yaml#/DriverRegisterRequest
    responses:
      '201':
        description: Tạo thành công
        content:
          application/json:
            schema:
              $ref: ../components/schemas/driver.yaml#/DriverEnvelope
      '403':
        $ref: ../components/responses/common.yaml#/ForbiddenError
  get:
    tags:
      - Driver
    summary: Danh sách tài xế theo trạng thái (service-to-service / Dispatch dùng)
    x-fr: FR-06
    parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
            - offline
            - available
            - busy
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/driver.yaml#/DriverListEnvelope
/drivers/login:
  post:
    tags:
      - Driver
    summary: Đăng nhập tài xế
    x-fr: FR-02
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/common.yaml#/LoginRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/driver.yaml#/DriverAuthResponse
      '401':
        $ref: ../components/responses/common.yaml#/UnauthorizedError
/drivers/me:
  get:
    tags:
      - Driver
    summary: Xem hồ sơ tài xế hiện tại
    x-fr: FR-02
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/driver.yaml#/DriverEnvelope
  put:
    tags:
      - Driver
    summary: Cập nhật hồ sơ cá nhân
    x-fr: FR-02
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/driver.yaml#/DriverUpdateRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/driver.yaml#/DriverEnvelope
/drivers/me/vehicle:
  put:
    tags:
      - Driver
    summary: Cập nhật thông tin phương tiện
    x-fr: FR-02
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/driver.yaml#/Vehicle
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/driver.yaml#/DriverEnvelope
      '400':
        $ref: ../components/responses/common.yaml#/ValidationError
/drivers/me/status:
  patch:
    tags:
      - Driver
    summary: Chuyển trạng thái sẵn sàng nhận chuyến
    x-fr: FR-11
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                enum:
                  - offline
                  - available
                  - busy
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/driver.yaml#/DriverEnvelope
      '400':
        $ref: ../components/responses/common.yaml#/ValidationError
/drivers/{id}:
  get:
    tags:
      - Driver
    summary: Tra cứu hồ sơ tài xế (nội bộ)
    x-fr: FR-02
    parameters:
      - $ref: ../components/parameters/common.yaml#/IdParam
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/driver.yaml#/DriverEnvelope
      '404':
        $ref: ../components/responses/common.yaml#/NotFoundError
