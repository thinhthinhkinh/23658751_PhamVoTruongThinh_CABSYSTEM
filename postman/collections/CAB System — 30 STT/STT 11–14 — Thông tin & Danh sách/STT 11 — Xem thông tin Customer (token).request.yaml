$kind: http-request
url: "{{BASE}}/customers/me"
method: GET
headers:
  Authorization: Bearer {{CUSTOMER_TOKEN}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Có id + email', () => { const d = pm.response.json().data; pm.expect(d.id).to.be.ok; pm.expect(d.email).to.be.ok; });
    language: text/javascript
order: 1000
