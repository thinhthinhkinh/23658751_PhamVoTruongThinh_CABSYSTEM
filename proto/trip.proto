syntax = "proto3";
package cab.trip;

service TripService {
  rpc CreateTrip       (CreateTripRequest)    returns (GrpcResponse);
  rpc ListAll          (AuthCtxRequest)       returns (GrpcResponse);
  rpc GetTripById      (TripIdRequest)        returns (GrpcResponse);
  rpc GetTripStatus    (TripIdRequest)        returns (GrpcResponse);
  rpc UpdateStatus     (UpdateStatusRequest)  returns (GrpcResponse);
  rpc CancelTrip       (TripIdRequest)        returns (GrpcResponse);
  rpc AddRating        (AddRatingRequest)     returns (GrpcResponse);
  rpc GetTripInternal  (TripIdRequest)        returns (GrpcResponse);
  rpc GetCustomerTrips (PaginatedRequest)     returns (GrpcResponse);
  rpc GetDriverTrips   (PaginatedRequest)     returns (GrpcResponse);
  rpc GetDriverRatings (UserIdRequest)        returns (GrpcResponse);
}

message CreateTripRequest {
  string customerId       = 1;
  double pickupLat        = 2;
  double pickupLng        = 3;
  double dropoffLat       = 4;
  double dropoffLng       = 5;
  string vehicleType      = 6;
}

message AuthCtxRequest {
  string callerId   = 1;
  string callerRole = 2;
}

message TripIdRequest {
  string tripId     = 1;
  string callerId   = 2;
  string callerRole = 3;
}

message UpdateStatusRequest {
  string tripId     = 1;
  string status     = 2;
  string callerId   = 3;
  string callerRole = 4;
}

message AddRatingRequest {
  string tripId     = 1;
  string customerId = 2;
  int32  score      = 3;
  string comment    = 4;
}

message PaginatedRequest {
  string userId     = 1;
  string callerRole = 2;
  int32  page       = 3;
  int32  limit      = 4;
}

message UserIdRequest {
  string userId     = 1;
  string callerRole = 2;
}

message GrpcResponse {
  bool   success       = 1;
  string json          = 2;
  string error_code    = 3;
  string error_message = 4;
  int32  http_status   = 5;
}
