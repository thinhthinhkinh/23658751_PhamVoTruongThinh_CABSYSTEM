syntax = "proto3";
package cab.admin;

service AdminService {
  rpc ListCustomers         (AuthCtxRequest)     returns (GrpcResponse);
  rpc ListDrivers           (AuthCtxRequest)     returns (GrpcResponse);
  rpc ListVehicles          (AuthCtxRequest)     returns (GrpcResponse);
  rpc DisableCustomer       (IdRequest)          returns (GrpcResponse);
  rpc ListTrips             (AuthCtxRequest)     returns (GrpcResponse);
  rpc GetDriverStatus       (IdRequest)          returns (GrpcResponse);
  rpc ListTransactions      (AuthCtxRequest)     returns (GrpcResponse);
  rpc ResolveTrip           (ResolveTripRequest) returns (GrpcResponse);
  rpc ReportTrips           (AuthCtxRequest)     returns (GrpcResponse);
  rpc ReportRevenue         (AuthCtxRequest)     returns (GrpcResponse);
  rpc ReportCompletionRate  (AuthCtxRequest)     returns (GrpcResponse);
  rpc ReportCancellationRate(AuthCtxRequest)     returns (GrpcResponse);
  rpc ReportDriverPerf      (AuthCtxRequest)     returns (GrpcResponse);
}

message AuthCtxRequest {
  string callerId   = 1;
  string callerRole = 2;
}

message IdRequest {
  string id         = 1;
  string callerId   = 2;
  string callerRole = 3;
}

message ResolveTripRequest {
  string tripId         = 1;
  string resolutionNote = 2;
  string callerId       = 3;
  string callerRole     = 4;
}

message GrpcResponse {
  bool   success       = 1;
  string json          = 2;
  string error_code    = 3;
  string error_message = 4;
  int32  http_status   = 5;
}
