# File này được tách tự động từ cab-system-openapi.yaml gốc — KHÔNG chỉnh sửa file gốc nữa.
FareCalculateRequest:
  type: object
  required:
    - vehicleType
    - distanceKm
    - durationMin
  properties:
    vehicleType:
      type: string
    distanceKm:
      type: number
    durationMin:
      type: number
FareCalculateResponse:
  type: object
  properties:
    data:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
          example: VND
        breakdown:
          type: object
          properties:
            baseFare:
              type: number
            perKm:
              type: number
            perMinute:
              type: number
PricingRule:
  type: object
  properties:
    vehicleType:
      type: string
    baseFare:
      type: number
    perKmRate:
      type: number
    perMinuteRate:
      type: number
