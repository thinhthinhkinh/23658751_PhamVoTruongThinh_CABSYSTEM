syntax = "proto3";
package cab.payment;

service PaymentService {
  rpc CreatePayment     (CreatePaymentRequest) returns (GrpcResponse);
  rpc ListAll           (AuthCtxRequest)       returns (GrpcResponse);
  rpc GetById           (PaymentIdRequest)     returns (GrpcResponse);
  rpc RetryPayment      (PaymentIdRequest)     returns (GrpcResponse);
  rpc GetMyPayments     (UserIdRequest)        returns (GrpcResponse);
}

message CreatePaymentRequest {
  string customerId = 1;
  string bookingId  = 2;
  string method     = 3;
}

message AuthCtxRequest {
  string callerId   = 1;
  string callerRole = 2;
}

message PaymentIdRequest {
  string paymentId  = 1;
  string callerId   = 2;
  string callerRole = 3;
}

message UserIdRequest {
  string userId     = 1;
  string callerRole = 2;
}

message GrpcResponse {
  bool   success       = 1;
  string json          = 2;
  string error_code    = 3;
  string error_message = 4;
  int32  http_status   = 5;
}
