# File này được tách tự động từ cab-system-openapi.yaml gốc — KHÔNG chỉnh sửa file gốc nữa.
/drivers/{id}/ratings:
  get:
    tags:
      - Rating
    summary: Điểm trung bình & lịch sử đánh giá của 1 tài xế
    x-fr: FR-05
    parameters:
      - $ref: ../components/parameters/common.yaml#/IdParam
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trip.yaml#/RatingListEnvelope
/trips:
  post:
    tags:
      - Trip
    summary: Tạo yêu cầu đặt xe
    x-fr: FR-03
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/trip.yaml#/TripCreateRequest
    responses:
      '201':
        description: Đã tạo yêu cầu, đang tìm tài xế
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trip.yaml#/TripEnvelope
      '400':
        $ref: ../components/responses/common.yaml#/ValidationError
/trips/{id}:
  get:
    tags:
      - Trip
    summary: Xem chi tiết & trạng thái hiện tại của 1 chuyến
    x-fr: FR-04
    parameters:
      - $ref: ../components/parameters/common.yaml#/IdParam
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trip.yaml#/TripEnvelope
      '404':
        $ref: ../components/responses/common.yaml#/NotFoundError
/trips/{id}/status:
  get:
    tags:
      - Trip
    summary: Poll trạng thái chuyến (khuyến nghị WebSocket cho real-time)
    x-fr: FR-04
    parameters:
      - $ref: ../components/parameters/common.yaml#/IdParam
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: ../components/schemas/trip.yaml#/TripStatus
  patch:
    tags:
      - Trip
    summary: Tài xế cập nhật trạng thái chuyến
    x-fr: FR-13
    parameters:
      - $ref: ../components/parameters/common.yaml#/IdParam
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - status
            properties:
              status:
                $ref: ../components/schemas/trip.yaml#/TripStatus
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trip.yaml#/TripEnvelope
      '400':
        $ref: ../components/responses/common.yaml#/ValidationError
/trips/{id}/cancel:
  post:
    tags:
      - Trip
    summary: Hủy chuyến
    x-fr: chưa chốt chính sách — xem Mục 9 tài liệu BA
    parameters:
      - $ref: ../components/parameters/common.yaml#/IdParam
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trip.yaml#/TripEnvelope
      '409':
        description: Chuyến không ở trạng thái có thể hủy
/trips/{id}/rating:
  post:
    tags:
      - Rating
    summary: Khách hàng đánh giá tài xế sau chuyến
    x-fr: FR-05
    parameters:
      - $ref: ../components/parameters/common.yaml#/IdParam
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/trip.yaml#/RatingCreateRequest
    responses:
      '201':
        description: Đã ghi nhận đánh giá
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trip.yaml#/RatingEnvelope
      '409':
        description: Chuyến chưa hoàn thành hoặc đã được đánh giá
/customers/me/trips:
  get:
    tags:
      - Trip
    summary: Lịch sử chuyến của khách hàng
    x-fr: FR-05
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trip.yaml#/TripListEnvelope
/drivers/me/trips:
  get:
    tags:
      - Trip
    summary: Lịch sử chuyến của tài xế
    x-fr: FR-13
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trip.yaml#/TripListEnvelope
