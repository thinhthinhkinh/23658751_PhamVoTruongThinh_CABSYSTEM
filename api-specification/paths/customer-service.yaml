# File này được tách tự động từ cab-system-openapi.yaml gốc — KHÔNG chỉnh sửa file gốc nữa.
/customers/register:
  post:
    tags:
      - Customer
    summary: Đăng ký tài khoản khách hàng
    x-fr: FR-01
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/customer.yaml#/CustomerRegisterRequest
    responses:
      '201':
        description: Đăng ký thành công
        content:
          application/json:
            schema:
              $ref: ../components/schemas/customer.yaml#/AuthResponse
      '400':
        $ref: ../components/responses/common.yaml#/ValidationError
      '409':
        $ref: ../components/responses/common.yaml#/ConflictError
/customers/login:
  post:
    tags:
      - Customer
    summary: Đăng nhập khách hàng, trả JWT
    x-fr: FR-01
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/common.yaml#/LoginRequest
    responses:
      '200':
        description: Đăng nhập thành công
        content:
          application/json:
            schema:
              $ref: ../components/schemas/customer.yaml#/AuthResponse
      '401':
        $ref: ../components/responses/common.yaml#/UnauthorizedError
/customers/me:
  get:
    tags:
      - Customer
    summary: Xem thông tin cá nhân hiện tại
    x-fr: FR-01
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/customer.yaml#/CustomerEnvelope
      '401':
        $ref: ../components/responses/common.yaml#/UnauthorizedError
  put:
    tags:
      - Customer
    summary: Cập nhật thông tin cá nhân
    x-fr: FR-01
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/customer.yaml#/CustomerUpdateRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/customer.yaml#/CustomerEnvelope
      '401':
        $ref: ../components/responses/common.yaml#/UnauthorizedError
/customers/{id}:
  get:
    tags:
      - Customer
    summary: Tra cứu hồ sơ khách hàng (nội bộ)
    x-fr: FR-01
    parameters:
      - $ref: ../components/parameters/common.yaml#/IdParam
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/customer.yaml#/CustomerEnvelope
      '403':
        $ref: ../components/responses/common.yaml#/ForbiddenError
      '404':
        $ref: ../components/responses/common.yaml#/NotFoundError
