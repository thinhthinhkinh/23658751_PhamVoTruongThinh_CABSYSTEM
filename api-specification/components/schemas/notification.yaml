# File này được tách tự động từ cab-system-openapi.yaml gốc — KHÔNG chỉnh sửa file gốc nữa.
Notification:
  type: object
  properties:
    id:
      type: string
      format: uuid
    userId:
      type: string
      format: uuid
    channel:
      type: string
    title:
      type: string
    body:
      type: string
    sentAt:
      type: string
      format: date-time
