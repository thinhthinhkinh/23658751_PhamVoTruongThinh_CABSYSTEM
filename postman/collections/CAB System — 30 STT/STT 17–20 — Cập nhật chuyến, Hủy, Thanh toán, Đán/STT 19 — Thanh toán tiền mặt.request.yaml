$kind: http-request
url: "{{BASE}}/payments"
method: POST
headers:
  Authorization: Bearer {{CUSTOMER_TOKEN}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "tripId": "{{TRIP_ID}}",
      "method": "cash"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      const r = pm.response.json();
      pm.test('status = completed', () => pm.expect(r.data.status).to.eql('completed'));
      pm.environment.set('PAYMENT_ID', r.data.id);
    language: text/javascript
order: 5000
