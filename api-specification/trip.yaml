# File TỰ CHỨA hoàn chỉnh cho trip-service.yaml — không phụ thuộc file nào khác.
# Sinh tự động từ nguồn hợp nhất, mọi $ref trong file này chỉ trỏ nội bộ (#/components/...).
openapi: 3.0.3
info:
  title: Trip Service API
  version: 1.0.0
  description: Vòng đời chuyến đi và đánh giá tài xế (FR-03,04,05,13)
servers:
  - url: http://localhost:4003
    description: Gọi trực tiếp service (bỏ qua Gateway)
  - url: http://localhost:3000/api/v1
    description: Qua API Gateway (local dev)
tags:
  - name: Trip
    description: Trip Service — FR-03, FR-04, FR-05, FR-13
  - name: Rating
    description: Đánh giá tài xế — phần cuối FR-05
security:
  - bearerAuth: []
paths:
  /drivers/{id}/ratings:
    get:
      tags:
        - Rating
      summary: Điểm trung bình & lịch sử đánh giá của 1 tài xế
      x-fr: FR-05
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingListEnvelope'
  /trips:
    post:
      tags:
        - Trip
      summary: Tạo yêu cầu đặt xe
      x-fr: FR-03
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreateRequest'
      responses:
        '201':
          description: Đã tạo yêu cầu, đang tìm tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
  /trips/{id}:
    get:
      tags:
        - Trip
      summary: Xem chi tiết & trạng thái hiện tại của 1 chuyến
      x-fr: FR-04
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /trips/{id}/status:
    get:
      tags:
        - Trip
      summary: Poll trạng thái chuyến (khuyến nghị WebSocket cho real-time)
      x-fr: FR-04
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TripStatus'
    patch:
      tags:
        - Trip
      summary: Tài xế cập nhật trạng thái chuyến
      x-fr: FR-13
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: '#/components/schemas/TripStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
  /trips/{id}/cancel:
    post:
      tags:
        - Trip
      summary: Hủy chuyến
      x-fr: chưa chốt chính sách — xem Mục 9 tài liệu BA
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '409':
          description: Chuyến không ở trạng thái có thể hủy
  /trips/{id}/rating:
    post:
      tags:
        - Rating
      summary: Khách hàng đánh giá tài xế sau chuyến
      x-fr: FR-05
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingCreateRequest'
      responses:
        '201':
          description: Đã ghi nhận đánh giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingEnvelope'
        '409':
          description: Chuyến chưa hoàn thành hoặc đã được đánh giá
  /customers/me/trips:
    get:
      tags:
        - Trip
      summary: Lịch sử chuyến của khách hàng
      x-fr: FR-05
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListEnvelope'
  /drivers/me/trips:
    get:
      tags:
        - Trip
      summary: Lịch sử chuyến của tài xế
      x-fr: FR-13
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
    GeoPoint:
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          format: double
          example: 10.7769
        lng:
          type: number
          format: double
          example: 106.7009
        address:
          type: string
    Rating:
      type: object
      properties:
        tripId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        score:
          type: integer
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    RatingCreateRequest:
      type: object
      required:
        - score
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
    RatingEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Rating'
    RatingListEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            averageScore:
              type: number
            ratings:
              type: array
              items:
                $ref: '#/components/schemas/Rating'
    Trip:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
          nullable: true
        pickupLocation:
          $ref: '#/components/schemas/GeoPoint'
        dropoffLocation:
          $ref: '#/components/schemas/GeoPoint'
        vehicleType:
          type: string
        status:
          $ref: '#/components/schemas/TripStatus'
        fareAmount:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TripCreateRequest:
      type: object
      required:
        - pickupLocation
        - dropoffLocation
        - vehicleType
      properties:
        pickupLocation:
          $ref: '#/components/schemas/GeoPoint'
        dropoffLocation:
          $ref: '#/components/schemas/GeoPoint'
        vehicleType:
          type: string
          enum:
            - 4-seat
            - 7-seat
            - motorbike
    TripEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Trip'
    TripListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
    TripStatus:
      type: string
      enum:
        - requested
        - finding_driver
        - no_driver_found
        - driver_assigned
        - arrived
        - picked_up
        - in_progress
        - completed
        - cancelled
  responses:
    NotFoundError:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
