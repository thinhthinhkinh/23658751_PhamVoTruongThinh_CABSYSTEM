$kind: http-request
url: "{{BASE}}/drivers/me/status"
method: PATCH
headers:
  Authorization: Bearer {{DRIVER_TOKEN}}
  Content-Type: application/json
body:
  type: text
  content: '{ "status": "available" }'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('status = available', () => pm.expect(pm.response.json().data.status).to.eql('available'));
    language: text/javascript
order: 2000
