$kind: http-request
url: "{{BASE}}/trips/{{TRIP_ID}}/rating"
method: POST
headers:
  Authorization: Bearer {{CUSTOMER_TOKEN}}
  Content-Type: application/json
body:
  type: text
  content: '{ "score": 5, "comment": "Tài xế rất tốt" }'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 hoặc 201', () => pm.expect([200,201]).to.include(pm.response.code));
      console.log('Rating:', JSON.stringify(pm.response.json()));
    language: text/javascript
order: 7000
