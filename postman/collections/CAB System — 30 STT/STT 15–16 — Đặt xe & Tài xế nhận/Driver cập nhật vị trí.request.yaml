$kind: http-request
url: "{{BASE}}/locations/me"
method: PUT
headers:
  Authorization: Bearer {{DRIVER_TOKEN}}
  Content-Type: application/json
body:
  type: text
  content: '{ "lat": 10.776, "lng": 106.700 }'
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
