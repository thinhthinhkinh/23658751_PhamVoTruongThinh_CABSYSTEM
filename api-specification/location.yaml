# File TỰ CHỨA hoàn chỉnh cho location-service.yaml — không phụ thuộc file nào khác.
# Sinh tự động từ nguồn hợp nhất, mọi $ref trong file này chỉ trỏ nội bộ (#/components/...).
openapi: 3.0.3
info:
  title: Location Service API
  version: 1.0.0
  description: Ghi nhận & truy vấn vị trí tài xế (FR-10)
servers:
  - url: http://localhost:4005
    description: Gọi trực tiếp service (bỏ qua Gateway)
  - url: http://localhost:3000/api/v1
    description: Qua API Gateway (local dev)
tags:
  - name: Location
    description: Location Service — FR-10
security:
  - bearerAuth: []
paths:
  /locations:
    post:
      tags:
        - Location
      summary: Tài xế gửi vị trí hiện tại
      x-fr: FR-10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoPoint'
      responses:
        '200':
          description: Đã ghi nhận vị trí
  /locations/drivers/{id}:
    get:
      tags:
        - Location
      summary: Vị trí hiện tại của 1 tài xế
      x-fr: FR-10
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DriverLocation'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /locations/nearby-drivers:
    get:
      tags:
        - Location
      summary: Tìm tài xế gần 1 tọa độ (Dispatch Service gọi)
      x-fr: FR-06
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
        - name: radiusKm
          in: query
          schema:
            type: number
            default: 5
        - name: driverIds
          in: query
          description: danh sách id cách nhau bởi dấu phẩy
          schema:
            type: string
      responses:
        '200':
          description: OK, sắp xếp theo khoảng cách tăng dần
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NearbyDriver'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DriverLocation:
      type: object
      properties:
        driverId:
          type: string
          format: uuid
        lat:
          type: number
        lng:
          type: number
        updatedAt:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
    GeoPoint:
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          format: double
          example: 10.7769
        lng:
          type: number
          format: double
          example: 106.7009
        address:
          type: string
    NearbyDriver:
      allOf:
        - $ref: '#/components/schemas/DriverLocation'
        - type: object
          properties:
            distanceKm:
              type: number
  responses:
    NotFoundError:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
