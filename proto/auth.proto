syntax = "proto3";

package cab.auth;

service AuthService {
  rpc RegisterCredentials (RegisterCredentialsRequest) returns (AuthResponse);
  rpc LoginByEmail        (LoginByEmailRequest)        returns (AuthResponse);
  rpc ValidateToken       (ValidateTokenRequest)       returns (ValidateTokenResponse);
  rpc RevokeToken         (RevokeTokenRequest)         returns (AuthResponse);
}

message RegisterCredentialsRequest {
  string userId   = 1;
  string email    = 2;
  string password = 3;
  string role     = 4;
}

message LoginByEmailRequest {
  string email    = 1;
  string password = 2;
}

message AuthResponse {
  bool   success       = 1;
  string json          = 2;
  int32  http_status   = 3;
  string error_code    = 4;
  string error_message = 5;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool   valid  = 1;
  string userId = 2;
  string role   = 3;
}

message RevokeTokenRequest {
  string token = 1;
}
