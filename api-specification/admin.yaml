openapi: 3.0.3
info:
  title: Admin / Reporting Service API
  version: 1.0.0
  description: >
    Quản trị & báo cáo, tổng hợp dữ liệu từ các service khác (FR-20..23).
    Tất cả endpoint yêu cầu role ops_staff hoặc ops_admin. Các thao tác
    xóa/khóa yêu cầu role ops_admin.
servers:
  - url: http://localhost:4009
    description: Gọi trực tiếp service (bỏ qua Gateway)
  - url: http://localhost:3000/api/v1
    description: Qua API Gateway (local dev)
tags:
  - name: Admin
    description: Admin/Reporting Service — FR-20..FR-23
security:
  - bearerAuth: []
paths:
  /admin/customers:
    get:
      tags:
        - Admin
      summary: Danh sách tất cả khách hàng
      x-fr: FR-20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
  /admin/customers/{id}:
    delete:
      tags:
        - Admin
      summary: Khóa tài khoản khách hàng (chỉ ops_admin)
      x-fr: FR-22
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Đã khóa
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /admin/drivers:
    get:
      tags:
        - Admin
      summary: Danh sách tất cả tài xế
      x-fr: FR-20
      responses:
        '200':
          description: OK
  /admin/vehicles:
    get:
      tags:
        - Admin
      summary: Danh sách phương tiện của tài xế
      x-fr: FR-20
      responses:
        '200':
          description: OK
  /admin/drivers/{id}/status:
    get:
      tags:
        - Admin
      summary: Kiểm tra trạng thái hoạt động của 1 tài xế
      x-fr: FR-21
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/NotFoundError'
  /admin/bookings:
    get:
      tags:
        - Admin
      summary: Danh sách tất cả booking
      x-fr: FR-21
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - requested
              - finding_driver
              - driver_assigned
              - no_driver_found
              - cancelled
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
  /admin/bookings/{id}/resolve:
    post:
      tags:
        - Admin
      summary: Ghi nhận xử lý sự cố của 1 booking
      x-fr: FR-21
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resolutionNote
              properties:
                resolutionNote:
                  type: string
                  example: Liên hệ tài xế xử lý trực tiếp
      responses:
        '200':
          description: Đã ghi nhận
        '404':
          $ref: '#/components/responses/NotFoundError'
  /admin/transactions:
    get:
      tags:
        - Admin
      summary: Tra cứu tất cả giao dịch thanh toán
      x-fr: FR-21
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
  /admin/reports/bookings:
    get:
      tags:
        - Admin
      summary: Báo cáo số lượng booking theo khoảng thời gian
      x-fr: FR-23
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportValue'
  /admin/reports/revenue:
    get:
      tags:
        - Admin
      summary: Báo cáo doanh thu (tổng tiền thanh toán thành công)
      x-fr: FR-23
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportValue'
  /admin/reports/completion-rate:
    get:
      tags:
        - Admin
      summary: Tỷ lệ booking được tài xế nhận (driver_assigned / total)
      x-fr: FR-23
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportValue'
  /admin/reports/cancellation-rate:
    get:
      tags:
        - Admin
      summary: Tỷ lệ booking bị hủy (cancelled / total)
      x-fr: FR-23
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportValue'
  /admin/reports/driver-performance:
    get:
      tags:
        - Admin
      summary: Hiệu quả hoạt động của từng tài xế
      x-fr: FR-23
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DriverPerformance'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Booking:
      type: object
      properties:
        bookingId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
          nullable: true
        vehicleType:
          type: string
        status:
          type: string
          enum:
            - requested
            - finding_driver
            - driver_assigned
            - no_driver_found
            - cancelled
        estimatedFare:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
    DriverPerformance:
      type: object
      properties:
        driverId:
          type: string
          format: uuid
        totalBookings:
          type: integer
          description: Số booking được tài xế nhận trong khoảng thời gian
        completionRate:
          type: number
          format: float
          description: Tỷ lệ hoàn thành chuyến (số chuyến completed / totalBookings)
        averageRating:
          type: number
          format: float
          nullable: true
          description: Điểm đánh giá trung bình từ Trip Service
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        method:
          type: string
          enum:
            - cash
            - e-wallet
            - card
        amount:
          type: number
        status:
          type: string
          enum:
            - pending
            - success
            - failed
        providerRef:
          type: string
          nullable: true
          description: Tham chiếu phía cổng thanh toán ngoài, không lưu số thẻ
        createdAt:
          type: string
          format: date-time
    ReportValue:
      type: object
      properties:
        data:
          type: object
          properties:
            from:
              type: string
              format: date-time
              nullable: true
            to:
              type: string
              format: date-time
              nullable: true
            value:
              type: number
  responses:
    ForbiddenError:
      description: Không có quyền thực hiện thao tác (cần ops_admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FromParam:
      name: from
      in: query
      description: Từ thời điểm (ISO 8601), ví dụ 2025-01-01T00:00:00Z
      schema:
        type: string
        format: date-time
    ToParam:
      name: to
      in: query
      description: Đến thời điểm (ISO 8601), ví dụ 2025-12-31T23:59:59Z
      schema:
        type: string
        format: date-time
