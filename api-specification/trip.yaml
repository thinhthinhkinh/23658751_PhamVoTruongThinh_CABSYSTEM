openapi: 3.0.3
info:
  title: Trip Service API
  version: 1.0.0
  description: >
    Vòng đời chuyến đi từ phía tài xế (FR-13), đánh giá tài xế (FR-05),
    lịch sử chuyến (FR-24/FR-25). Trip được tạo tự động khi tài xế nhận
    booking; khách hàng không tạo Trip trực tiếp.
servers:
  - url: http://localhost:4011
    description: Gọi trực tiếp service (bỏ qua Gateway)
  - url: http://localhost:3000/api/v1
    description: Qua API Gateway (local dev)
tags:
  - name: Trip
    description: Trip Service — FR-13, FR-24, FR-25
  - name: Rating
    description: Đánh giá tài xế — FR-05
security:
  - bearerAuth: []
paths:
  /drivers/{id}/ratings:
    get:
      tags:
        - Rating
      summary: Điểm trung bình & lịch sử đánh giá của 1 tài xế
      x-fr: FR-05
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingListEnvelope'
  /trips/{id}:
    get:
      tags:
        - Trip
      summary: Xem chi tiết & trạng thái hiện tại của 1 chuyến (tra cứu theo bookingId)
      description: >
        `{id}` là `bookingId` (1 booking ↔ 1 trip, dùng chung ID).
        Endpoint trả về sau khi tài xế nhận chuyến (status = driver_assigned).
      x-fr: FR-04
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /trips/{id}/status:
    patch:
      tags:
        - Trip
      summary: Tài xế cập nhật trạng thái chuyến
      description: >
        Trình tự hợp lệ: driver_assigned → arrived → picked_up → in_progress → completed.
        Khi chuyển sang `completed` phải gửi kèm `distanceKm` và `durationMin`
        để tính cước thực tế (`actualFare`).
      x-fr: FR-13
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Chuyển trạng thái không hợp lệ theo state machine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trips/{id}/rating:
    post:
      tags:
        - Rating
      summary: Khách hàng đánh giá tài xế sau chuyến hoàn thành
      x-fr: FR-05
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingCreateRequest'
      responses:
        '201':
          description: Đã ghi nhận đánh giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingEnvelope'
        '409':
          description: Chuyến chưa hoàn thành hoặc đã được đánh giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /customers/me/trips:
    get:
      tags:
        - Trip
      summary: Lịch sử chuyến của khách hàng
      x-fr: FR-24
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListEnvelope'
  /drivers/me/trips:
    get:
      tags:
        - Trip
      summary: Lịch sử chuyến của tài xế
      x-fr: FR-25
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_TRANSITION
            message:
              type: string
    GeoPoint:
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          format: double
          example: 10.7769
        lng:
          type: number
          format: double
          example: 106.7009
        address:
          type: string
    Rating:
      type: object
      properties:
        ratingId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    RatingCreateRequest:
      type: object
      required:
        - score
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
    RatingEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Rating'
    RatingListEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            averageScore:
              type: number
              example: 4.5
            ratings:
              type: array
              items:
                $ref: '#/components/schemas/Rating'
    Trip:
      type: object
      properties:
        tripId:
          type: string
          format: uuid
          description: Cùng giá trị với bookingId (1 booking ↔ 1 trip)
        bookingId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        pickupLocation:
          $ref: '#/components/schemas/GeoPoint'
        dropoffLocation:
          $ref: '#/components/schemas/GeoPoint'
        vehicleType:
          type: string
          enum:
            - 4-seat
            - 7-seat
            - motorbike
        status:
          $ref: '#/components/schemas/TripStatus'
        estimatedFare:
          type: number
          nullable: true
          description: Cước ước tính từ booking-service (tính theo đường thẳng)
        actualFare:
          type: number
          nullable: true
          description: >
            Cước thực tế sau khi hoàn thành. BR-10: actualFare = max(estimatedFare, fare tính theo
            distanceKm & durationMin thực tế). Null cho đến khi status = completed.
        distanceKm:
          type: number
          nullable: true
          description: Khoảng cách thực tế (km), điền khi completed
        durationMin:
          type: number
          nullable: true
          description: Thời gian thực tế (phút), điền khi completed
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TripStatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/TripStatus'
        distanceKm:
          type: number
          description: Bắt buộc khi status = completed
          example: 5.2
        durationMin:
          type: number
          description: Bắt buộc khi status = completed
          example: 18
    TripEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Trip'
    TripListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
    TripStatus:
      type: string
      description: >
        Trạng thái chuyến đi. Trip bắt đầu ở driver_assigned (không có requested/finding_driver
        — những trạng thái đó thuộc Booking Service).
      enum:
        - driver_assigned
        - arrived
        - picked_up
        - in_progress
        - completed
  responses:
    NotFoundError:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedError:
      description: Chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenError:
      description: Không có quyền thực hiện thao tác này
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: bookingId (dùng làm định danh chung cho cả booking lẫn trip)
      schema:
        type: string
        format: uuid
