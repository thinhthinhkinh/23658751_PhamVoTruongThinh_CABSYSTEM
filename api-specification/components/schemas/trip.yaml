# File này được tách tự động từ cab-system-openapi.yaml gốc — KHÔNG chỉnh sửa file gốc nữa.
GeoPoint:
  type: object
  required:
    - lat
    - lng
  properties:
    lat:
      type: number
      format: double
      example: 10.7769
    lng:
      type: number
      format: double
      example: 106.7009
    address:
      type: string
TripCreateRequest:
  type: object
  required:
    - pickupLocation
    - dropoffLocation
    - vehicleType
  properties:
    pickupLocation:
      $ref: trip.yaml#/GeoPoint
    dropoffLocation:
      $ref: trip.yaml#/GeoPoint
    vehicleType:
      type: string
      enum:
        - 4-seat
        - 7-seat
        - motorbike
TripStatus:
  type: string
  enum:
    - requested
    - finding_driver
    - no_driver_found
    - driver_assigned
    - arrived
    - picked_up
    - in_progress
    - completed
    - cancelled
Trip:
  type: object
  properties:
    id:
      type: string
      format: uuid
    customerId:
      type: string
      format: uuid
    driverId:
      type: string
      format: uuid
      nullable: true
    pickupLocation:
      $ref: trip.yaml#/GeoPoint
    dropoffLocation:
      $ref: trip.yaml#/GeoPoint
    vehicleType:
      type: string
    status:
      $ref: trip.yaml#/TripStatus
    fareAmount:
      type: number
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
TripEnvelope:
  type: object
  properties:
    data:
      $ref: trip.yaml#/Trip
TripListEnvelope:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: trip.yaml#/Trip
RatingCreateRequest:
  type: object
  required:
    - score
  properties:
    score:
      type: integer
      minimum: 1
      maximum: 5
    comment:
      type: string
Rating:
  type: object
  properties:
    tripId:
      type: string
      format: uuid
    driverId:
      type: string
      format: uuid
    score:
      type: integer
    comment:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
RatingEnvelope:
  type: object
  properties:
    data:
      $ref: trip.yaml#/Rating
RatingListEnvelope:
  type: object
  properties:
    data:
      type: object
      properties:
        averageScore:
          type: number
        ratings:
          type: array
          items:
            $ref: trip.yaml#/Rating
