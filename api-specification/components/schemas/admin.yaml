# File này được tách tự động từ cab-system-openapi.yaml gốc — KHÔNG chỉnh sửa file gốc nữa.
ReportValue:
  type: object
  properties:
    data:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        value:
          type: number
DriverPerformance:
  type: object
  properties:
    driverId:
      type: string
      format: uuid
    totalTrips:
      type: integer
    completionRate:
      type: number
    averageRating:
      type: number
