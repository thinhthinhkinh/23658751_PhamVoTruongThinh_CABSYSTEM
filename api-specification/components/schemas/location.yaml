# File này được tách tự động từ cab-system-openapi.yaml gốc — KHÔNG chỉnh sửa file gốc nữa.
DriverLocation:
  type: object
  properties:
    driverId:
      type: string
      format: uuid
    lat:
      type: number
    lng:
      type: number
    updatedAt:
      type: string
      format: date-time
NearbyDriver:
  allOf:
    - $ref: location.yaml#/DriverLocation
    - type: object
      properties:
        distanceKm:
          type: number
