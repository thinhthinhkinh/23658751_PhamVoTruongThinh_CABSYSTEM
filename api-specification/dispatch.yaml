# File TỰ CHỨA hoàn chỉnh cho dispatch-service.yaml — không phụ thuộc file nào khác.
# Sinh tự động từ nguồn hợp nhất, mọi $ref trong file này chỉ trỏ nội bộ (#/components/...).
openapi: 3.0.3
info:
  title: Dispatch Service API
  version: 1.0.0
  description: 'Matching engine: tìm & phân công tài xế (FR-06..09, FR-12)'
servers:
  - url: http://localhost:4004
    description: Gọi trực tiếp service (bỏ qua Gateway)
  - url: http://localhost:3000/api/v1
    description: Qua API Gateway (local dev)
tags:
  - name: Dispatch
    description: Dispatch Service — FR-06..FR-09, FR-12
security:
  - bearerAuth: []
paths:
  /dispatch/{tripId}/accept:
    post:
      tags:
        - Dispatch
      summary: Tài xế chấp nhận chuyến được đề xuất
      x-fr: FR-12
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      responses:
        '200':
          description: Đã nhận chuyến
        '409':
          description: Chuyến đã được tài xế khác nhận hoặc đã hết hạn
  /dispatch/{tripId}/decline:
    post:
      tags:
        - Dispatch
      summary: Tài xế từ chối chuyến — hệ thống tự tìm tài xế khác
      x-fr: FR-08, FR-12
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      responses:
        '200':
          description: Đã ghi nhận từ chối, hệ thống tiếp tục tìm tài xế khác
  /dispatch/{tripId}/candidates:
    get:
      tags:
        - Dispatch
      summary: Danh sách tài xế được xét cho 1 chuyến (audit/debug)
      x-fr: FR-06, FR-07
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DispatchCandidate'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DispatchCandidate:
      type: object
      properties:
        driverId:
          type: string
          format: uuid
        distanceKm:
          type: number
        offeredAt:
          type: string
          format: date-time
        result:
          type: string
          enum:
            - pending
            - accepted
            - declined
            - timeout
  parameters:
    TripIdParam:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        format: uuid
