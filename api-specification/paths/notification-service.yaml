# File này được tách tự động từ cab-system-openapi.yaml gốc — KHÔNG chỉnh sửa file gốc nữa.
/notifications/me:
  get:
    tags:
      - Notification
    summary: Xem lịch sử thông báo đã nhận
    x-fr: FR-17, FR-18
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/schemas/notification.yaml#/Notification
/notifications/channels:
  post:
    tags:
      - Notification
    summary: Đăng ký/kích hoạt thêm kênh thông báo mới
    x-fr: FR-19
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - type
            properties:
              name:
                type: string
                example: Zalo OA
              type:
                type: string
                enum:
                  - push
                  - sms
                  - email
                  - zalo
                  - webhook
    responses:
      '201':
        description: Đã thêm kênh mới
      '403':
        $ref: ../components/responses/common.yaml#/ForbiddenError
