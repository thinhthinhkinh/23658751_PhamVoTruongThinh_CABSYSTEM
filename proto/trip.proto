syntax = "proto3";
package cab.trip;

service TripService {
  rpc CreateTripInternal  (CreateTripInternalRequest) returns (GrpcResponse);
  rpc GetTripByBookingId  (BookingIdRequest)          returns (GrpcResponse);
  rpc GetTripInternal     (BookingIdRequest)          returns (GrpcResponse);
  rpc UpdateTripStatus    (UpdateTripStatusRequest)   returns (GrpcResponse);
  rpc AddRating           (AddRatingRequest)          returns (GrpcResponse);
  rpc GetDriverRatings    (UserIdRequest)             returns (GrpcResponse);
  rpc GetDriverTrips      (PaginatedRequest)          returns (GrpcResponse);
  rpc GetCustomerTrips    (PaginatedRequest)          returns (GrpcResponse);
}

message CreateTripInternalRequest {
  string bookingId     = 1;
  string driverId      = 2;
  string customerId    = 3;
  string vehicleType   = 4;
  double pickupLat     = 5;
  double pickupLng     = 6;
  double dropoffLat    = 7;
  double dropoffLng    = 8;
  double estimatedFare = 9;
}

message BookingIdRequest {
  string bookingId  = 1;
  string callerId   = 2;
  string callerRole = 3;
}

message UpdateTripStatusRequest {
  string bookingId   = 1;
  string status      = 2;
  string callerId    = 3;
  string callerRole  = 4;
  double distanceKm  = 5;
  double durationMin = 6;
}

message AddRatingRequest {
  string bookingId  = 1;
  string customerId = 2;
  int32  score      = 3;
  string comment    = 4;
}

message PaginatedRequest {
  string userId     = 1;
  string callerRole = 2;
  int32  page       = 3;
  int32  limit      = 4;
}

message UserIdRequest {
  string userId     = 1;
  string callerRole = 2;
}

message GrpcResponse {
  bool   success       = 1;
  string json          = 2;
  string error_code    = 3;
  string error_message = 4;
  int32  http_status   = 5;
}
