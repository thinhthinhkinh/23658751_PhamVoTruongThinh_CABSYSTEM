syntax = "proto3";
package cab.notification;

service NotificationService {
  rpc GetMyNotifications (UserIdRequest)   returns (GrpcResponse);
  rpc AddChannel         (AddChanRequest)  returns (GrpcResponse);
}

message UserIdRequest {
  string userId     = 1;
  string callerRole = 2;
}

message AddChanRequest {
  string name       = 1;
  string type       = 2;
  string callerId   = 3;
  string callerRole = 4;
}

message GrpcResponse {
  bool   success       = 1;
  string json          = 2;
  string error_code    = 3;
  string error_message = 4;
  int32  http_status   = 5;
}
