syntax = "proto3";
package cab.customer;

service CustomerService {
  rpc Register      (RegisterRequest)      returns (GrpcResponse);
  rpc Login         (LoginRequest)         returns (GrpcResponse);
  rpc GetProfile    (UserIdRequest)        returns (GrpcResponse);
  rpc UpdateProfile (UpdateProfileRequest) returns (GrpcResponse);
  rpc ListAll       (AuthCtxRequest)       returns (GrpcResponse);
  rpc GetById       (GetByIdRequest)       returns (GrpcResponse);
  rpc Disable       (GetByIdRequest)       returns (GrpcResponse);
  rpc GetMyTrips    (PaginatedRequest)     returns (GrpcResponse);
  rpc GetMyPayments (UserIdRequest)        returns (GrpcResponse);
}

message RegisterRequest {
  string fullName = 1;
  string email    = 2;
  string password = 3;
  string phone    = 4;
}

message LoginRequest {
  string email    = 1;
  string password = 2;
}

message UserIdRequest {
  string userId      = 1;
  string callerRole  = 2;
}

message UpdateProfileRequest {
  string userId   = 1;
  string fullName = 2;
  string phone    = 3;
}

message AuthCtxRequest {
  string callerId   = 1;
  string callerRole = 2;
}

message GetByIdRequest {
  string id         = 1;
  string callerId   = 2;
  string callerRole = 3;
}

message PaginatedRequest {
  string userId     = 1;
  string callerRole = 2;
  int32  page       = 3;
  int32  limit      = 4;
}

message GrpcResponse {
  bool   success       = 1;
  string json          = 2;
  string error_code    = 3;
  string error_message = 4;
  int32  http_status   = 5;
}
