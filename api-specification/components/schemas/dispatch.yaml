# File này được tách tự động từ cab-system-openapi.yaml gốc — KHÔNG chỉnh sửa file gốc nữa.
DispatchCandidate:
  type: object
  properties:
    driverId:
      type: string
      format: uuid
    distanceKm:
      type: number
    offeredAt:
      type: string
      format: date-time
    result:
      type: string
      enum:
        - pending
        - accepted
        - declined
        - timeout
